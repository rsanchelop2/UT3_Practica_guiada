<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:fragment="head(titulo)">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' · Nexo Reservas'">Nexo Reservas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet"
        >
  <link th:href="@{/css/app.css}" rel="stylesheet">
    </head>
    <body>
        <!-- Fragmentos reutilizados por todas las vistas. -->
        <nav th:fragment="nav" class="navbar navbar-expand-lg nexo-nav">
            <div class="container-xl">
  <a class="navbar-brand fw-bold" th:href="@{/}"><span class="brand-mark"><i class="bi bi-grid-1x2-fill"></i></span> Nexo<span class="brand-accent">Reservas</span></a>
  <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navPrincipal"
                    aria-controls="navPrincipal"
                    aria-expanded="false"
                    aria-label="Abrir navegación"
                ><span class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="navPrincipal">
                    <ul class="navbar-nav ms-auto gap-lg-2">
                        <li class="nav-item"><a class="nav-link" th:href="@{/}"><i class="bi bi-speedometer2 me-1"></i> Inicio</a>
                        </li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/salas}"><i class="bi bi-door-open me-1"></i> Salas</a>
                        </li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/clientes}"><i class="bi bi-people me-1"></i> Clientes</a>
                        </li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/reservas}"><i class="bi bi-calendar-check me-1"></i> Reservas</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <div th:fragment="mensajes" class="container-xl mt-3">
            <div th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="status"><i class="bi bi-check-circle me-2"></i><span th:text="${exito}"></span><button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert"><i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>
        </div>
        <footer
            th:fragment="footer"
            class="container-xl py-4 small text-secondary d-flex justify-content-between"
        ><span>Nexo Reservas · Gestión de espacios</span><span>© Mikel Aingeru Jorge Soteras</span>
        </footer>
        <th:block th:fragment="scripts">
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
            </script>
        </th:block>
    </body>
</html>
